<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--ssr-head-->
    <!-- Default head. The server replaces everything between these markers
         with the per-page tags for server-rendered routes. -->
    <title>Kiosk</title>
    <meta
      name="description"
      content="Kiosk - an interview and chat interface with an overlay drawer: category interviews, WhatsApp-style chats and a marketplace browser."
    />
    <!--/ssr-head-->
    <script>
      // Apply the saved (or system) theme before paint to avoid a light flash.
      (function () {
        try {
          var stored = localStorage.getItem('kiosk-theme')
          var theme = stored === 'dark' || stored === 'light'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
        } catch (e) {}
      })()
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#3b82f6" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%233b82f6'/%3E%3Cpath d='M6 9h12M6 13h12M6 17h8' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!-- The server renders listing pages into this outlet; SPA routes leave it
         empty and the client mounts into it. -->
    <div id="root"><!--ssr-outlet--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
