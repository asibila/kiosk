# Render Blueprint for the frontend static site.
#
# The UI uses BrowserRouter, so every unknown path (/search, /results,
# /listing/:id) must return index.html and let React handle the route. Without
# this rewrite a direct visit or refresh returns Render's 404 page.
services:
  - type: web
    name: kiosk
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://kiosk-api-znxy.onrender.com
    routes:
      # Old cached bundles call /api/* on the static site origin. Proxy those to
      # the API so they keep working (and so the app can also be used
      # same-origin). This rule must come before the SPA fallback.
      - type: rewrite
        source: /api/*
        destination: https://kiosk-api-znxy.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
